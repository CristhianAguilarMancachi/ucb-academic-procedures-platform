services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ucb_postgres_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: ucb_tramites
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d ucb_tramites"
        ]
      start_interval: 2s
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ucb_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ucb.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: ucb_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      start_interval: 2s
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 5

  # ==========================================================
  # API EXTERNA SIMULADA DE PAGOS / FACTURACION
  # ==========================================================
  #
  # Este servicio representa durante desarrollo al sistema
  # externo de pagos que posteriormente sera sustituido por
  # la API institucional.
  #
  # El backend se comunica con este servicio exclusivamente
  # mediante HTTP.
  # ==========================================================

  mock_pago_api:
    build:
      context: ./backend
    container_name: ucb_mock_pago_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command:
      [
        "uvicorn",
        "mock_pago_api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "9000"
      ]
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/app
      - mock_pago_data:/app/mock_pago_api/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=3)"
        ]
      start_interval: 2s
      start_period: 10s
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: ucb_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      mock_pago_api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
        ]
      start_interval: 2s
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: ucb_frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  gateway:
    image: nginx:alpine
    container_name: ucb_gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  pgadmin_data:
  ollama_data:
  mock_pago_data: