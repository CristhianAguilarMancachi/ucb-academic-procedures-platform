
<div class="layout">

  <!-- BARRA SUPERIOR PARA MÓVILES -->
  <header class="mobile-header">
    <div class="mobile-header__brand">
      <img
        src="/assets/images/logo_ucb_original.png"
        alt="Universidad Católica Boliviana"
        class="mobile-header__logo"
      />

      <div class="mobile-header__identity">
        <strong>UCB</strong>
        <span>Trámites académicos</span>
      </div>
    </div>

    <button
      #menuButton
      type="button"
      class="mobile-menu-button"
      (click)="alternarMenuMovil()"
      [attr.aria-expanded]="menuMovilAbierto()"
      aria-controls="main-navigation"
      [attr.aria-label]="
        menuMovilAbierto()
          ? 'Cerrar menú de navegación'
          : 'Abrir menú de navegación'
      "
    >
      @if (menuMovilAbierto()) {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      } @else {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      }
    </button>
  </header>

  <!-- FONDO DEL MENÚ MÓVIL -->
  @if (menuMovilAbierto()) {
    <button
      type="button"
      class="mobile-backdrop"
      (click)="cerrarMenuMovil()"
      aria-label="Cerrar menú lateral"
      tabindex="-1"
    ></button>
  }

  <!-- SIDEBAR EXISTENTE -->
  <aside
    #navigation
    id="main-navigation"
    class="sidebar"
    [class.sidebar--open]="menuMovilAbierto()"
    [attr.aria-label]="'Navegación principal'"
  >
    <button type="button" class="mobile-menu-button sidebar-close"
      aria-label="Cerrar menú de navegación" (click)="cerrarMenuMovil()">×</button>
    <app-app-sidebar></app-app-sidebar>
  </aside>

  <!-- ÁREA PRINCIPAL -->
  <div class="main-area" [attr.inert]="menuMovilAbierto() ? '' : null">

    <main class="content" id="main-content">
      <router-outlet></router-outlet>
    </main>

    <footer class="footer">
      <app-app-footer></app-app-footer>
    </footer>

  </div>
</div>
