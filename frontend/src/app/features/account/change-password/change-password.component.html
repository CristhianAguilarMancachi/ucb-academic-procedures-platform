<section>
  <h1>Cambiar contraseña</h1>

  <p>
    Ingresa tu contraseña actual y establece una nueva.
  </p>

  <form
    [formGroup]="formulario"
    (ngSubmit)="cambiarContrasena()"
  >

    <div>
      <label for="contrasena_actual">
        Contraseña actual
      </label>

      <input
        id="contrasena_actual"
        type="password"
        formControlName="contrasena_actual"
        autocomplete="current-password"
      />
    </div>

    <div>
      <label for="nueva_contrasena">
        Nueva contraseña
      </label>

      <input
        id="nueva_contrasena"
        type="password"
        formControlName="nueva_contrasena"
        autocomplete="new-password"
      />
    </div>

    <div>
      <label for="confirmar_nueva_contrasena">
        Confirmar nueva contraseña
      </label>

      <input
        id="confirmar_nueva_contrasena"
        type="password"
        formControlName="confirmar_nueva_contrasena"
        autocomplete="new-password"
      />
    </div>

    @if (error()) {
      <p>{{ error() }}</p>
    }

    @if (mensaje()) {
      <p>{{ mensaje() }}</p>
    }

    <button
      type="submit"
      [disabled]="guardando()"
    >
      {{
        guardando()
          ? 'Actualizando...'
          : 'Cambiar contraseña'
      }}
    </button>

  </form>
</section>
