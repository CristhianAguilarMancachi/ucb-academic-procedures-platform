<section class="rag-home" [class.chat-mode]="conversationStarted()">
  <ng-container *ngIf="!conversationStarted(); else chatMode">
    <div class="welcome-mode">
      <div class="welcome-inner">
        <div class="hero-icon">
          <ng-icon name="heroSparkles" class="sparkle-icon"></ng-icon>
        </div>

        <div class="hero-text">
          <h2>Hola, soy tu <span>asistente académico</span></h2>
          <p>
            Encuentra información oficial sobre trámites, reglamentos y consultas académicas
            de la Universidad Católica Boliviana “San Pablo”.
          </p>
        </div>

        <div class="composer composer-centered">
          <input
            type="text"
            placeholder="Escribe tu consulta aquí..."
            [(ngModel)]="question"
            (keyup.enter)="submitQuery()"
          />

          <button class="composer-send" (click)="submitQuery()" [disabled]="loading()">
            <ng-icon name="heroPaperAirplane" class="send-icon"></ng-icon>
          </button>
        </div>

        <div class="suggested-header">
          <span>Preguntas sugeridas</span>
        </div>

        <div class="suggested-grid compact">
          <button
            class="suggested-card compact"
            *ngFor="let item of suggestedQuestions"
            (click)="useSuggestedQuestion(item)"
          >
            {{ item }}
          </button>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-template #chatMode>
    <app-rag-chat
      [messages]="messages()"
      [question]="question"
      [loading]="loading()"
      (questionChange)="updateQuestion($event)"
      (submit)="submitQuery()"
      (clear)="clearConversation()"
      (toggleSources)="toggleSources($event)"
    />
  </ng-template>
</section>
