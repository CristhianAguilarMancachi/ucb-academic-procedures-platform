<section>
  <h1>Restablecer contraseña</h1>

  @if (error) {
    <p>{{ error }}</p>
  }

  @if (!mensaje && token !== null) {
    <form
      [formGroup]="formulario"
      (ngSubmit)="restablecer()"
    >
      <div>
        <label for="nueva">
          Nueva contraseña
        </label>

        <input
          id="nueva"
          type="password"
          formControlName="nueva_contrasena"
        />
      </div>

      <div>
        <label for="confirmar">
          Confirmar nueva contraseña
        </label>

        <input
          id="confirmar"
          type="password"
          formControlName="confirmar_nueva_contrasena"
        />
      </div>

      <button
        type="submit"
        [disabled]="cargando"
      >
        {{
          cargando
            ? 'Restableciendo...'
            : 'Cambiar contraseña'
        }}
      </button>
    </form>
  }

  @if (mensaje) {
    <p>{{ mensaje }}</p>

    <a routerLink="/login">
      Iniciar sesión
    </a>
  }
</section>
