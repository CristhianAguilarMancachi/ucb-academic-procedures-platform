<app-auth-layout variant="forgot"
  ><header class="auth-heading">
    <div class="auth-emblem"><app-auth-icon name="heroUser" /></div>
    <h1 id="auth-title">Recuperar contraseña</h1>
    <p>Ingresa tu correo electrónico para<br />enviarte un enlace de recuperación.</p>
  </header>
  <form [formGroup]="formulario" (ngSubmit)="solicitar()" [attr.aria-busy]="cargando">
    <div class="auth-field">
      <label for="correo">Correo electrónico</label>
      <div class="auth-input">
        <app-auth-icon name="heroEnvelope" /><input
          id="correo"
          type="email"
          formControlName="correo"
          autocomplete="email"
          placeholder="Ingresa tu correo institucional o personal"
        />
      </div>
    </div>
    @if (formulario.controls.correo.touched && formulario.controls.correo.invalid) {
      <small class="auth-validation">Ingresa un correo válido.</small>
    }
    @if (mensaje) {
      <p class="auth-message" role="status">{{ mensaje }}</p>
    }
    <button class="auth-primary" type="submit" [disabled]="cargando">
      <app-auth-icon name="heroArrowRightOnRectangle" /><span>{{
        cargando ? 'Enviando...' : 'Enviar enlace de recuperación'
      }}</span>
    </button>
  </form>
  <div class="auth-return">
    <a class="auth-back" routerLink="/login"
      ><app-auth-icon name="heroArrowLeft" />Volver al inicio de sesión</a
    >
  </div></app-auth-layout
>
