<section>
  <h1>Recuperar contraseña</h1>

  <p>
    Ingresa el correo asociado a tu cuenta.
  </p>

  <form
    [formGroup]="formulario"
    (ngSubmit)="solicitar()"
  >
    <label for="correo">Correo</label>

    <input
      id="correo"
      type="email"
      formControlName="correo"
    />

    <button
      type="submit"
      [disabled]="cargando"
    >
      {{
        cargando
          ? 'Enviando...'
          : 'Enviar instrucciones'
      }}
    </button>
  </form>

  @if (mensaje) {
    <p>{{ mensaje }}</p>
  }

  <a routerLink="/login">
    Volver al inicio de sesión
  </a>
</section>
